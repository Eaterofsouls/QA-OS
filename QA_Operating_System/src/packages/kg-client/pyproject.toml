[project]
name = "kg-client"
version = "1.0.0"
description = "Knowledge Graph client — the ONLY code path permitted to issue Cypher queries"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "neo4j>=5.28,<6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "kg_client"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
