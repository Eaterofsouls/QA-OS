[project]
name = "extraction"
version = "1.0.0"
description = "Shared structured extraction backbone used by Modules 1, 6, and 8"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "llm-gateway-client", "instructor>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "extraction"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
