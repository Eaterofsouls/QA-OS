[project]
name = "api"
version = "1.0.0"
description = "FastAPI application serving the AI QA OS REST API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.111", "uvicorn>=0.29", "pydantic>=2.0", "kg-client", "llm-gateway-client", "extraction", "module-01", "module-02", "module-03"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
