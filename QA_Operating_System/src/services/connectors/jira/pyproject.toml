[project]
name = "jira-connector"
version = "1.0.0"
description = "Jira Cloud adapter implementing the universal Connector contract"
requires-python = ">=3.12"
dependencies = [
    "connector-contract>=1.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",        # httpx mock library
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
