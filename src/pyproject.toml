[project]
name = "qa-os"
version = "1.0.0"
description = "AI QA Operating System — monorepo root"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.uv.workspace]
members = [
    "packages/connector-contract",
    "packages/kg-client",
    "packages/llm-gateway-client",
    "packages/schemas",
    "packages/config-service",
    "packages/extraction",
    "services/api",
    "services/orchestrator",
    "services/connectors/jira",
    "services/connectors/github",
    "services/connectors/slack",
    "services/connectors/playwright",
    "services/connectors/legacy",
    "services/graph-service",
    "modules/module-01",
    "modules/module-02",
    "modules/module-03",
    "modules/module-04",
    "modules/module-05",
    "modules/module-06",
    "modules/module-07",
    "modules/module-08",
    "modules/module-09",
]

[tool.uv.sources]
connector-contract = { workspace = true }
kg-client = { workspace = true, editable = false }
llm-gateway-client = { workspace = true, editable = false }
qa-schemas = { workspace = true }
config-service = { workspace = true }
extraction = { workspace = true, editable = false }
module-01 = { workspace = true, editable = false }
module-02 = { workspace = true, editable = false }
module-03 = { workspace = true, editable = false }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "deepeval>=1.0",
    "ragas>=0.1",
]

[tool.pytest.ini_options]
testpaths = [
    "packages",
    "services",
    "modules",
    "infra",
]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
