[project]
name = "module-03"
version = "1.0.0"
description = "Module 3: Human Review Gate — test suite approval. One of two mandatory human-in-the-loop gates."
requires-python = ">=3.12"
dependencies = [
    "qa-schemas",
    "kg-client",
    "pydantic>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "module_03"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
