version: "3.9"

# =============================================================
# AI QA Operating System — Local Development Infrastructure
# Run: docker-compose up -d
# Stop: docker-compose down
# =============================================================

services:

  # ---- Neo4j 5.26.x Enterprise LTS (PACK-01 / Prompt_0011) ----
  neo4j:
    image: neo4j:5.26.0-enterprise
    container_name: qa-os-neo4j
    environment:
      NEO4J_AUTH: neo4j/qa-os-dev-password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      # Vector search support (for native hybrid/vector retrieval)
      NEO4J_dbms_index_fulltext_default_analyzer: standard-no-stop-words
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # ---- PostgreSQL 16.x (PACK-01 / Prompt_0021) ----
  postgres:
    image: postgres:16-alpine
    container_name: qa-os-postgres
    environment:
      POSTGRES_DB: qaos
      POSTGRES_USER: qaos
      POSTGRES_PASSWORD: qa-os-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaos -d qaos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---- MinIO (S3-compatible object storage) (PACK-01 / Prompt_0101) ----
  minio:
    image: minio/minio:latest
    container_name: qa-os-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- MinIO bucket bootstrap ----
  minio-init:
    image: minio/mc:latest
    container_name: qa-os-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/qa-os-traces;
        mc anonymous set none local/qa-os-traces;
        echo 'Bucket qa-os-traces created.';
      "
    restart: "no"

  # ---- LiteLLM Gateway (PACK-03 / Prompt_0041) ----
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.35.0
    container_name: qa-os-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-placeholder}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ---- Temporal (PACK-01 / Prompt_0471) — feature-flagged, starts but serves no workflows ----
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: qa-os-temporal
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: qaos
      POSTGRES_PWD: qa-os-dev-password
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - temporal   # Only starts if: docker-compose --profile temporal up
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: qa-os-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal
    profiles:
      - temporal
    restart: unless-stopped

  # ---- OpenTelemetry Collector (PACK-05) ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: qa-os-otel
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  postgres_data:
  minio_data:

networks:
  default:
    name: qa-os-network
